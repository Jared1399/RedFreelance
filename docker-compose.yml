services:
  db:
    image: postgres:15-alpine
    container_name: redfreelance-db
    restart: always
    environment:
      POSTGRES_DB: redfreelance
      POSTGRES_USER: redfreelance
      POSTGRES_PASSWORD: secret
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432" 

  web:
    build:
      context: .
      dockerfile: Dockerfile   
    container_name: redfreelance-web
    env_file:
      - .env
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://redfreelance:secret@db:5432/redfreelance
    depends_on:
      - db
      
  socket:
    build:
      context: .               
      dockerfile: Dockerfile.socket  
    container_name: redfreelance-socket
    restart: always           
    ports:
      - "4000:4000"
    depends_on:
      - web          
  
  cron:
    build: .
    container_name: redfreelance_cron
    command: ["pm2-runtime", "ecosystem.config.cjs"]
    restart: always
    environment:
      - NODE_ENV=production         

volumes:
  db-data:
