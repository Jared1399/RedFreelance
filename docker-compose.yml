services:
  db:
    image: postgres:15-alpine
    container_name: redfreelance-db
    restart: always
    environment:
      POSTGRES_DB: redfreelance
      POSTGRES_USER: redfreelance
      POSTGRES_PASSWORD: secret
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432" 

  web:
    image: nobelium13/redfreelance-web:latest
    container_name: redfreelance-web
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed && npm start"]
    env_file:
      - .env
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://redfreelance:secret@db:5432/redfreelance
    depends_on:
      - db
      
  socket:
    image: nobelium13/redfreelance-socket:latest
    container_name: redfreelance-socket
    restart: always 	
    ports:
      - "4000:4000"
    depends_on:
      - web 		
  
  cron:
    image: nobelium13/redfreelance-cron:latest
    depends_on:
      - db
    command: ["pm2-runtime", "start", "ecosystem.config.cjs", "--only", "expire-transactions-cron", "--env", "production"]
volumes:
  db-data: